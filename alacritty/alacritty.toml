general.import = [
	"~/.config/alacritty/catppuccin-frappe.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.8
blur = true
decorations = "None"

padding = { x = 10, y = 10 }

[font]
normal.family = "Monaspace Neon"
size = 12

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
